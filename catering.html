<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Bug Bakery</title>
    <link href="style.css"rel="stylesheet"/> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=New+Rocker&family=Pinyon+Script&display=swap" rel="stylesheet">

  </head>
  <body>
  <section id="title" class="container">
  <h1">Bug Bakery</h1>
    <div id="navigation">
    <button> <a alt="Catering Form" href="/.catering.html"> Catering Form </a> </button>
    <button> <a alt="FAQ/About" href="/.faq-about.html"> FAQ/About </a> </button>
    <button><a alt="Portfolio" href="/.portfolio">Portfolio</a> </button>
  </div>
</section>
  <h2> Catering Form </h2>
<div>
 <form id="catering-form" class="container">
   <label for="name"> Your Name: </label>
    <input type="text" name="name" placeholder="Your Name" id="request-name" required>
  <div>
    <label for="email"> Your Email: </label>
    <input type="email" name="email" placeholder="Your Email">
  </div>
  <div>
   <label for="good">Type of Good:</label>
    <select name="good" id="request-good" required>
      <option value="Select Here">Select Here</option>
      <option value="Whole Cake/Pie">Whole Cake/Pie</option>
      <option value="Sninamon Rolls">Sninamon Rolls</option>
      <option value="Macaron">Macaron</option>
      <option value="Custom">Custom</option>
    </select>
  </div>
  <div>
    <label for="description">Description:</label>
<input type="text" name="description" placeholder="Description" id="description">
  </div>
  <div>
    <input type="submit" value="Register">
  </div>
</form> 
  <div hidden id="confirmation-message"></div>
<script src="./script.js"> </script>
</div>
</body>
